<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
  @page {
    size: A4;
    margin: 2cm 2.2cm;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Serif CJK SC", "Source Han Serif CN", "Noto Sans CJK SC", "Source Han Sans CN", sans-serif;
    font-size: 11pt;
    line-height: 1.8;
    color: #2c2c2c;
  }

  /* ===== Cover ===== */
  .cover {
    page-break-after: always;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100%;
    text-align: center;
  }
  .cover .logo img {
    max-height: 60px;
    margin-bottom: 20px;
  }
  .cover h1 {
    font-size: 28pt;
    color: #1b5e20;
    letter-spacing: 6px;
    margin-bottom: 12px;
  }
  .cover .subtitle {
    font-size: 13pt;
    color: #666;
    margin-bottom: 50px;
  }
  .cover .meta {
    font-size: 10.5pt;
    color: #555;
    line-height: 2.2;
  }
  .cover .meta span { color: #2e7d32; font-weight: 600; }

  /* ===== Content ===== */
  .content { padding: 0; }

  h2 {
    font-size: 16pt;
    color: #1b5e20;
    border-bottom: 2px solid #4caf50;
    padding-bottom: 4px;
    margin: 28px 0 14px 0;
    page-break-after: avoid;
  }
  h3 {
    font-size: 13pt;
    color: #2e7d32;
    margin: 20px 0 10px 0;
    padding-left: 10px;
    border-left: 3px solid #81c784;
    page-break-after: avoid;
  }
  h4 {
    font-size: 11.5pt;
    color: #333;
    margin: 16px 0 8px 0;
  }
  p { margin: 6px 0; text-indent: 2em; }
  p.no-indent { text-indent: 0; }

  ul, ol { margin: 6px 0 6px 2em; }
  li { margin: 3px 0; }

  strong { color: #1b5e20; }
  em { color: #555; }

  /* ===== Tables ===== */
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 10pt;
  }
  th {
    background: #e8f5e9;
    color: #1b5e20;
    padding: 6px 10px;
    border: 1px solid #a5d6a7;
    text-align: center;
    font-weight: 600;
  }
  td {
    padding: 5px 10px;
    border: 1px solid #a5d6a7;
  }
  tr:nth-child(even) td { background: #f9fbe7; }

  /* ===== Info Box ===== */
  .info-box {
    background: #f1f8e9;
    border-left: 4px solid #4caf50;

    padding: 10px 14px;
    margin: 12px 0;
    border-radius: 0 4px 4px 0;
  }
  .info-box p { text-indent: 0; margin: 2px 0; }

  .warning-box {
    background: #fff3e0;
    border-left: 4px solid #ff9800;
    padding: 10px 14px;
    margin: 12px 0;
    border-radius: 0 4px 4px 0;
  }
  .warning-box p { text-indent: 0; margin: 2px 0; }

  /* ===== Sources ===== */
  .sources {
    margin-top: 24px;
    padding-top: 12px;
    border-top: 1px solid #ccc;
  }
  .sources h3 { border-left-color: #999; color: #555; }
  .sources ol { font-size: 9.5pt; color: #555; }
  .sources a { color: #2e7d32; text-decoration: none; word-break: break-all; }

  /* ===== Footer ===== */
  .footer {
    text-align: center;
    font-size: 8.5pt;
    color: #999;
    margin-top: 30px;
    padding-top: 10px;
    border-top: 1px solid #ddd;
  }

  /* ===== Disclaimer ===== */
  .disclaimer {
    text-align: center;
    font-size: 8pt;
    color: #bdbdbd;
    margin-top: 4px;
  }

  img { max-width: 100%; height: auto; margin: 8px 0; }

  code {
    font-family: "Courier New", monospace;
    font-size: 9.5pt;
    background: #f5f5f5;
    padding: 1px 4px;
    border-radius: 2px;
  }

  blockquote {
    border-left: 3px solid #a5d6a7;
    margin: 8px 0;
    padding: 4px 12px;
    color: #555;
    background: #fafafa;
  }
</style>
</head>
<body>

<!-- Cover -->
<div class="cover">
  <div class="logo">{{ logo_data_uri }}</div>
  <h1>农作物病虫害防治诊疗报告</h1>
  <p class="subtitle">中国矿业大学徐海学院 · 禾影千寻团队</p>
  <div class="meta">
    <p>报告编号：<span>{{ report_id }}</span></p>
    <p>生成日期：<span>{{ date }}</span></p>
    {% if crop_name %}
    <p>作物名称：<span>{{ crop_name }}</span></p>
    {% endif %}
    {% if agent_name %}
    <p>诊断专家：<span>{{ agent_name }}</span></p>
    {% endif %}
  </div>
</div>

<!-- Content -->
<div class="content">
{{ body_html }}
</div>

<div class="footer">
  <p>本报告由 QianXun 千寻有方自动生成 | {{ date }}</p>
  <p class="disclaimer">本报告由 AI 自动生成，仅供参考，禾影千寻团队不对报告内容的准确性作任何保证。</p>
</div>

</body>
</html>
